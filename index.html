<style>
  :root{ --glass:rgba(10,14,30,.58); --line:rgba(150,180,255,.16); --ink:#e9eeff; --mute:#8f9cc2; --accent:#9cc1ff; --gold:#ffd27a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#02030a;color:var(--ink);
    font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .hidden{display:none!important}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;touch-action:none}
  .glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}

  header.brand{position:fixed;top:20px;left:20px;display:flex;gap:12px;align-items:center;pointer-events:none}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:.04em}

  .chip{font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);white-space:nowrap}
  .chip:hover{background:rgba(255,255,255,.12)}
  .chip.on{background:var(--accent);color:#0b1330;border-color:transparent;font-weight:500}

  #lang{position:fixed;top:18px;right:104px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-top:env(safe-area-inset-top)}
  #music{position:fixed;top:18px;right:20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #music.on{background:var(--accent);color:#0b1330;border-color:transparent;font-weight:500}
  #hStop{position:fixed;top:18px;right:104px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5f8cff,#d6e4ff);transition:width .2s}
  #nav{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:2px;padding:6px;
    max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  #nav button{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;font-size:13.5px;white-space:nowrap;color:#cdd6f3;flex:none}
  #nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  #nav button.on{background:rgba(156,193,255,.18);color:#fff}
  #nav button.go{color:var(--gold)}
  #nav .dot{width:9px;height:9px;border-radius:50%;flex:none}
  #nav .sep{width:1px;background:var(--line);margin:6px 4px;flex:none}

  #bubble{position:fixed;left:0;top:0;padding:10px 16px 11px;border-radius:16px;background:#fff;color:#1b2140;font-size:15px;font-weight:700;
    white-space:normal;max-width:260px;width:max-content;text-align:center;line-height:1.35;pointer-events:none;opacity:0;transition:opacity .35s;box-shadow:0 6px 24px rgba(0,0,0,.35);margin-top:-14px}
  #bubble::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff;border-bottom:0}
  #bubble.show{opacity:1}
  #title{position:fixed;left:50%;top:66%;transform:translate(-50%,10px);text-align:center;pointer-events:none;opacity:0;
    transition:opacity .9s,transform .9s;white-space:nowrap}
  #title.show{opacity:1;transform:translate(-50%,0)}
  #tCon{font-size:28px;font-weight:700;letter-spacing:.14em;text-shadow:0 0 28px rgba(110,150,255,.65),0 2px 10px #000}
  #tStar{font-size:13px;color:#c8d2ef;margin-top:8px;letter-spacing:.06em;text-shadow:0 1px 6px #000}
  #credit{position:fixed;left:12px;bottom:6px;font-size:9.5px;color:#56607e;pointer-events:none;margin-bottom:env(safe-area-inset-bottom)}
  @media (max-width:760px){ #credit{bottom:3px;font-size:8.5px} }
  #pop{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);padding:14px 16px;min-width:260px;z-index:5;margin-bottom:env(safe-area-inset-bottom)}
  #pop .pt{font-size:13px;color:var(--mute);margin-bottom:10px}
  #pop input[type=date]{width:100%;font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);color-scheme:dark}
  #pop .prow{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
  #pop .pgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  #pop .pn{width:34px;height:34px;border-radius:50%;font-size:13px;color:#cdd6f3;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  #pop .pn:hover{background:rgba(255,255,255,.14)}
  #pop .pn.on{background:var(--accent);color:#0b1330;font-weight:700;border-color:transparent}
  #pop .pgrid.years{grid-template-columns:repeat(6,1fr);max-height:230px;overflow-y:auto;padding-right:4px}
  #pop .pgrid.years .pn{width:auto;border-radius:10px;padding:0 6px}
  #pop .pgrid.months{grid-template-columns:repeat(6,1fr)}
  #pop .pgrid.months .pn{width:auto;border-radius:10px}
  @media (max-width:760px){ #pop{bottom:66px;left:12px;right:12px;transform:none;min-width:0} #pop .pn{width:30px;height:30px;font-size:12px} }
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;font-size:12px;color:#e3eaff;padding:2px 9px;border-radius:10px;
    background:rgba(8,12,28,.5);border:1px solid rgba(150,180,255,.2);white-space:nowrap;
    will-change:transform;transition:opacity .3s;opacity:0;pointer-events:none}
  .lbl:hover{background:rgba(156,193,255,.3)}
  .lbl.star{background:none;border:0;padding:1px 4px;font-size:11.5px;color:#c9d6ff;text-shadow:0 0 6px #000,0 0 2px #000}
  .lbl.star:hover{color:#fff}
  .lbl.con{background:none;border:0;font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--accent);text-shadow:0 0 8px #000}
  .lbl.con.sel{color:#fff}

  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#02030a;z-index:10;transition:opacity .8s}
  #loading div{font-size:14px;color:var(--mute);letter-spacing:.08em;text-align:center}
  #loading .ring{width:42px;height:42px;border-radius:50%;border:2px solid rgba(156,193,255,.15);border-top-color:var(--accent);
    animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:760px){
    header.brand{top:14px;left:14px}
    .brand h1{font-size:15px}
    #hStop{top:12px;right:92px}
    #music{top:12px;right:12px}
    #lang{top:12px;right:92px}
    #nav{bottom:12px}
    #tCon{font-size:21px}
    #tStar{font-size:11.5px}
  }
  /* 버튼 줄: 제목 아래 왼쪽 맞춤 */
  #nav{left:20px;right:auto;top:66px;bottom:auto;transform:none;margin-top:env(safe-area-inset-top);margin-bottom:0}
  #nav button.icon{font-size:17px;padding:7px 11px}
  #pop{left:20px;right:auto;top:122px;bottom:auto;transform:none;min-width:0;max-width:min(560px,calc(100vw - 40px));margin-top:env(safe-area-inset-top);margin-bottom:0}
  #pop .pgrid, #pop .pgrid.years, #pop .pgrid.months{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;gap:6px;padding:2px 2px 8px;scrollbar-width:thin}
  #pop .pgrid .pn, #pop .pgrid.years .pn, #pop .pgrid.months .pn{flex:none;width:auto;min-width:38px;height:36px;padding:0 8px;border-radius:10px}
  @media (max-width:760px){
    #nav{left:12px;right:12px;top:52px;bottom:auto;max-width:calc(100vw - 24px)}
    #pop{left:12px;right:12px;top:106px;max-width:none}
    .brand h1{font-size:12.5px;letter-spacing:.02em}
    header.brand svg{width:26px;height:26px}
    header.brand{gap:8px}
    #lang,#music{font-size:11.5px;padding:6px 9px}
    #lang{right:70px}
  }
  #pop{padding:3px;width:auto;min-width:0;max-width:none;right:auto;border-radius:10px}
  #pop .plist{display:flex;flex-direction:column;gap:0;max-height:min(46vh,300px);overflow-y:auto;scrollbar-width:thin}
  #pop .plist .pn{flex:none;width:auto;min-width:0;height:auto;padding:3px 9px;border-radius:6px;border:0;background:none;text-align:center;font-size:11.5px;line-height:1.35}
  #pop .plist .pn:hover{background:rgba(255,255,255,.1)}
  #pop .plist .pn.on{background:var(--accent);color:#0b1330}
  @media (max-width:760px){ #pop{right:auto} }
  /* 오른쪽 위 버튼 줄 */
  #topbar{position:fixed;top:18px;right:20px;display:flex;align-items:center;gap:6px;margin-top:env(safe-area-inset-top);z-index:3}
  #topbar #lang, #topbar #music{position:static;margin:0}
  #topbar .chip{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #topbar .chip.sm{font-size:11px;padding:5px 9px;color:var(--gold)}
  #topbar .chip.sm.on{background:rgba(156,193,255,.22);color:#fff}
  #topbar #music.on{background:var(--accent);color:#0b1330}
  @media (max-width:760px){
    #topbar{top:12px;right:12px;gap:4px}
    #topbar .chip.sm{font-size:10.5px;padding:5px 7px}
    #topbar #lang, #topbar #music{font-size:11px;padding:5px 8px}
    .brand h1{font-size:11px}
    #nav{right:auto}
  }
  @media (max-width:430px){
    .brand h1{font-size:12.5px}
    #topbar{top:50px}
    #nav{top:90px}
  }
  /* 모든 버튼: 테두리 없음 + 투명 바탕 */
  #nav, #topbar .chip, #nav button, #topbar #music, #topbar #lang{background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  #nav button:hover, #topbar .chip:hover{background:transparent!important;color:#fff}
  #nav button.on, #topbar .chip.sm.on{color:#fff;text-decoration:underline;text-underline-offset:4px}
  #topbar #music.on{color:var(--accent);font-weight:600}
  /* 고른 값은 아주 작게, 제목과 버튼 줄 사이 간격 줄이기 */
  #nav button .pv{font-size:9px;margin-left:2px;opacity:.85;vertical-align:middle;letter-spacing:0}
  #nav{top:50px;padding:0}
  #nav button.icon{padding:3px 8px}
  @media (max-width:760px){ #nav{top:40px} }
  @media (max-width:430px){ #topbar{top:12px;gap:0} #topbar .chip.sm, #topbar #lang{padding:5px 6px} #nav{top:40px} }

  #nav button.hold{position:relative;overflow:hidden;font-size:11.5px;padding:5px 10px;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
  #nav{flex-direction:row;align-items:center;gap:2px}
  #nav button.sm{font-size:11px;padding:4px 7px;color:var(--gold)}
  .holdtrack{position:fixed;left:0;right:0;top:0;width:100vw;height:5px;margin:0;border-radius:0;z-index:4;pointer-events:none;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .2s}
  .holdtrack.show{opacity:1}
  .holdtrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb84d,var(--gold));border-radius:3px}
  .holdtrack.done i{box-shadow:0 0 10px var(--gold)}
  #nav button.hold.holding{color:var(--gold)}
  #nav button.hold.done{color:#fff;text-shadow:0 0 10px var(--gold)}
  #voy{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3;margin-bottom:env(safe-area-inset-bottom)}
  #voy .vbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px}
  #voy .vbtns button{font-size:14px;font-weight:500;color:var(--gold);padding:8px 6px;background:none;border:0;white-space:nowrap}
  #voy .vbtns button:hover{color:#fff}
  #voy .vbtns button.on{color:#fff;text-decoration:underline;text-underline-offset:5px}
  #route{position:static;text-align:center;max-width:100%;pointer-events:none}
  #route .names{font-size:11.5px;color:var(--mute);line-height:1.7}
  #route .names b{margin:0 5px;color:#4a5578;font-weight:400}
  #route .names span.cur{color:var(--gold);font-weight:700}
  #route .names span.past{color:#c8d2ef;text-decoration:line-through;text-decoration-color:rgba(200,210,239,.4)}
  #route .go{font-size:13px;color:var(--gold);font-weight:500;margin-top:2px}
  @media (max-width:760px){ #voy{bottom:22px} #voy .vbtns button{font-size:13px;padding:6px 4px} #voy .vbtns{gap:0 12px} }
  #nav, #nav button, .holdtrack{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #nav button.hold{min-height:34px;padding:8px 12px;touch-action:none}
  /* 뭉치·치노 버튼: 작게, 제목 아래 왼쪽으로 */
  #voy{left:20px;right:auto;top:50px;bottom:auto;transform:none;align-items:flex-start;margin-top:env(safe-area-inset-top);margin-bottom:0;gap:2px}
  #voy .vbtns{justify-content:flex-start;gap:0 14px}
  #voy .vbtns button{font-size:11.5px;font-weight:500;padding:5px 0}
  #route{text-align:left}
  #route .names{font-size:11px}
  #route .go{font-size:12px}
  @media (max-width:760px){ #voy{left:12px;top:40px;width:calc(100vw - 24px)} #voy .vbtns button{font-size:11px;padding:4px 0} #voy .vbtns{gap:0 12px} }
  #route{display:none!important}   /* 선택된 별 이름·'여기로 떠나요' 표시하지 않음 */
  /* 말풍선: 어두운 유리 카드 + 금빛 테두리 */
  #bubble{padding:9px 14px 10px!important;border-radius:14px!important;max-width:230px!important;
    background:linear-gradient(160deg,rgba(28,34,66,.92),rgba(12,15,32,.92))!important;color:#eef2ff!important;
    border:1px solid rgba(255,214,140,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.03) inset,0 0 18px rgba(255,200,110,.12)!important;
    transform-origin:50% 100%;transition:opacity .35s,scale .35s;scale:.92}
  #bubble.show{scale:1}
  #bubble::after{content:''!important;left:50%!important;bottom:-6px!important;width:10px;height:10px;border:0!important;
    background:rgb(14,17,36);border-right:1px solid rgba(255,214,140,.38)!important;border-bottom:1px solid rgba(255,214,140,.38)!important;
    transform:translateX(-50%) rotate(45deg)!important}
  #bubble b{display:block;font-size:12.5px;font-weight:600;letter-spacing:.02em;color:#ffd98a;white-space:nowrap}
  #bubble b::before{content:'✦';margin-right:5px;font-size:10px;opacity:.85}
  #bubble .fm{display:block;margin-top:4px;font-size:11px;font-weight:400;line-height:1.55;color:#c9d2f0;word-break:keep-all}
  #voy .vbtns #zStop{color:#ff9a8a}
  #voy .vbtns #zStop:hover{color:#fff}
</style>

<div id="labels"></div>

<header class="brand">
  <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
    <circle cx="17" cy="17" r="5" fill="#ffc46b"/>

  setTimeout(function(){ if(!window.__ready){ var m=document.getElementById('loadMsg');

function smokeMap(){            // 연기처럼 번지는 옅은 회색 얼룩 (값 노이즈 fbm, 확인용 렌더러와 같은 알고리즘)
  const NW=256, NH=128, out=new Float32Array(NW*NH); let st=77731, amp=1, tot=0;
  const rnd=()=>{ st=(Math.imul(st,1664525)+1013904223)>>>0; return st/4294967296; };
  for (const cell of [32,16,8,4]){ const gw=NW/cell, gh=NH/cell+1, g=[];
    for (let y=0;y<gh;y++){ const row=[]; for (let x=0;x<gw;x++) row.push(rnd()); g.push(row); }
    for (let y=0;y<NH;y++) for (let x=0;x<NW;x++){ const xs=x/cell, ys=y/cell, x0=Math.floor(xs), y0=Math.floor(ys);
      let fx=xs-x0, fy=ys-y0; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
      const G=(yy,xx)=>g[yy%gh][xx%gw];
      out[y*NW+x]+=amp*((G(y0,x0)*(1-fx)+G(y0,x0+1)*fx)*(1-fy)+(G(y0+1,x0)*(1-fx)+G(y0+1,x0+1)*fx)*fy); }
    tot+=amp; amp*=.5; }
  const c=document.createElement('canvas'); c.width=NW; c.height=NH; const ctx=c.getContext('2d'), im=ctx.createImageData(NW,NH);
  const warm=[0xc9,0xbe,0xb0];
  for (let i=0;i<NW*NH;i++){ const v=out[i]/tot, w=.42*Math.min(1,Math.max(0,(v-.38)/.3));
    im.data[i*4]=255*(1-w)+warm[0]*w; im.data[i*4+1]=255*(1-w)+warm[1]*w; im.data[i*4+2]=255*(1-w)+warm[2]*w; im.data[i*4+3]=255; }
  ctx.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t;
}

function glassMat(){            // 헬멧 유리: 가장자리만 은은하게 빛나는 투명 구 + 반사광

      void main(){ vec4 mv=modelViewMatrix*vec4(position,1.); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying vec3 vN; varying vec3 vV;

    _hp.copy(dog.position).addScaledVector(dogSurf?dogSurf.n:_u, dog.scale.x*dogParts.bubble).project(camera);
    $('bubble').style.transform=`translate(${(_hp.x*.5+.5)*innerWidth}px,${(-_hp.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;
  }
}

/* ================= 시간 (화면 조절 없이 일정하게 흐름) ================= */
const J2000 = Date.UTC(2000,0,1,12), DAY = 86400000;
let simDays=(Date.now()-J2000)/DAY; const speed=2;
const angleOf=(b,days)=>(b.L0+360*days/b.period)*DEG;
function updateBodies(){
  for (const b of BODIES){
    if (b.id==='sun'){ b.mesh.rotation.y = simDays*2*Math.PI/25.4*.05; continue; }
    const a=angleOf(b,simDays);
    b.pivot.position.set(Math.cos(a)*b.d, 0, -Math.sin(a)*b.d);
    b.mesh.rotation.y = simDays*2*Math.PI/b.rot*.02;
    if (b.clouds) b.clouds.rotation.y = b.mesh.rotation.y*1.15;
    if (b.moonPivot) b.moonPivot.rotation.y = simDays*2*Math.PI/27.32;
  }
}

/* ================= 비행 구간(leg) 엔진 ================= */
let legs=[], leg=null, selCon=null, voyaging=false, inSolar=true;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeQuint=t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2;
function runLegs(list){ legs=list.slice(); nextLeg(); }
function nextLeg(){
  leg=legs.shift()||null;
  if (!leg){ controls.enabled=true; camera.fov=55; camera.updateProjectionMatrix(); controls.update(); return; }
  controls.enabled=false; leg.t=0;
  if (leg.onStart) leg.onStart(leg);
  leg.from=camera.position.clone(); leg.fromT=controls.target.clone();
  if (leg.hold!=null){ if (leg.follow) leg.follow.pivot.getWorldPosition(leg.lastF=new V3()); return; }
  const d=leg.dest(), dist=camera.position.distanceTo(d.pos);
  if (leg.dur==null) leg.dur=Math.min(6.5,Math.max(2.2,2.2+dist/55));
  if (leg.lift==null) leg.lift=0;
  if (leg.kick==null) leg.kick=dist>30?20:0;
}
function updateLeg(dt){
  if (leg.hold!=null){
    leg.t+=dt;
    if (leg.follow){ leg.follow.pivot.getWorldPosition(tmp); camera.position.add(tmp.clone().sub(leg.lastF)); controls.target.copy(tmp); leg.lastF.copy(tmp); }
    const off=camera.position.clone().sub(controls.target);
    if (!leg.noOrbit && off.length()>1e-3){ off.applyAxisAngle(UP,dt*.12); camera.position.copy(controls.target).add(off); }
    camera.lookAt(controls.target);
    if (leg.t>=leg.hold){ const L=leg; if (L.onDone) L.onDone(); if (leg===L) nextLeg(); }
    return;
  }
  leg.t=Math.min(1,leg.t+dt/leg.dur);
  const k=(leg.ease||ease)(leg.t), kt=ease(Math.min(1,leg.t*1.6)), d=leg.dest();
  camera.position.lerpVectors(leg.from,d.pos,k); camera.position.y += Math.sin(Math.PI*k)*leg.lift;
  controls.target.lerpVectors(leg.fromT,d.tgt,kt);
  camera.fov = 55 + Math.pow(Math.sin(Math.PI*k),2)*leg.kick; camera.updateProjectionMatrix();
  camera.lookAt(controls.target);
  if (leg.onStep) leg.onStep(k, leg.t);
  if (leg.t>=1){ const L=leg; camera.fov=55; camera.updateProjectionMatrix(); if (L.onDone) L.onDone(); if (leg===L) nextLeg(); }
}

/* ---------- 목적지 ---------- */
const EARTH = BODIES.find(b=>b.id==='earth');
function destFor(body){
  if (!body) return { pos:HOME.pos.clone(), tgt:HOME.tgt.clone() };
  const p=body.pivot.getWorldPosition(new V3()), sc=solarGroup.scale.x;
  if (body.id==='sun') return { pos:new V3(20,9,26).multiplyScalar(sc), tgt:p };
  const dir=p.clone().normalize(), side=new V3().crossVectors(UP,dir).normalize();
  const off=dir.clone().multiplyScalar(-.55).add(side.multiplyScalar(.85)).normalize().multiplyScalar(body.r*5.5*sc);
  off.y += body.r*1.3*sc;
  return { pos:p.clone().add(off), tgt:p };
}
function conView(con){
  const c=con.centroid, dir=c.clone().normalize(), side=new V3().crossVectors(UP,dir).normalize();
  const off=side.multiplyScalar(con.spread*2.1).addScaledVector(dir,-con.spread*.5).add(new V3(0,con.spread*.45,0));
  return { pos:c.clone().add(off), tgt:c.clone() };
}
function nearStar(s, fromPos){
  const r=Math.max(s.target,s.cur);
  const dir=(fromPos||camera.position).clone().sub(s.pos).normalize(), side=new V3().crossVectors(UP,dir).normalize();
  const off=dir.multiplyScalar(r*5.5).addScaledVector(side,r*2.5).add(new V3(0,r*1.4,0));
  return { pos:s.pos.clone().add(off), tgt:s.pos.clone() };
}

/* ---------- 태양계 ↔ 성간 공간 전환 ---------- */
function setSolarScale(s){ solarGroup.scale.setScalar(s); solarGroup.visible = s>SOLAR_MIN*1.01 || inSolar; }
function departLeg(con, fromName){
  return { dest:()=>conView(con), ease:easeQuint, kick:28,
    onStart:(L)=>{ inSolar=false; starLayer.visible=true; selCon=con; markNav(con.id); setBigCon(null);
      const d=camera.position.distanceTo(conView(con).pos); L.dur=7+2*Math.log10(d/LY+1); L.total=d; planTricks(L);
      Object.assign(hud,{ route:`${fromName} → ${con.name}`, kind:'travel', dest:conView(con).pos, total:d, phase:'항해 중' }); },
    onStep:(k,t)=>{ setSolarScale(Math.exp(Math.log(SOLAR_MIN)*Math.min(1,t/.22))); setLayerOpacity(Math.min(1,t/.18)); if (t>.6) setBigCon(con); },

function hopLeg(con, fromName){

      const d=camera.position.distanceTo(conView(con).pos); L.dur=7+2*Math.log10(d/LY+1); planTricks(L);
      Object.assign(hud,{ route:`${fromName} → ${con.name}`, kind:'travel', dest:conView(con).pos, total:d, phase:'항해 중' }); },

function returnLeg(target, label){

    onStart:()=>{ setBigCon(null); solarGroup.visible=true; Object.assign(hud,{ route:label||'태양계로 귀환', kind:'home', phase:'귀환' }); },
    onStep:(k)=>{ setSolarScale(Math.exp(Math.log(SOLAR_MIN)*(1-Math.min(1,k*1.25)))); setLayerOpacity(1-k); },
    onDone:()=>{ inSolar=true; dogOn=false; setSolarScale(1); starLayer.visible=false; setLayerOpacity(0); controls.minDistance=12; } };

function systemHold(con){

      showTitle(con.name, `별 ${members.length}개 · 지구에서 평균 ${fmtLy(con.centroid.length()/LY)}광년`); }, onDone:hideTitle };
}
const STAY=7;   // 뭉치·치노 모두 별에 머무는 시간(초)
function starLegs(con, max=4, holdT=2.6, first=null, noView=false, fast=false){
  let named=STARS.filter(s=>s.con===con.id && s.name).sort((a,b)=>a.v-b.v);
  if (first && first.con===con.id) named=[first, ...named.filter(x=>x!==first)];
  named=named.slice(0,max);
  const L=[];
  named.forEach((s,i)=>{
    L.push({ dest:()=>nearStar(s, s._from), dur:fast?2.2:3.2, kick:10,
      onStart:()=>{ s._from=camera.position.clone(); Object.assign(hud,{ route:`${con.name} · ${s.name}`, kind:'star', star:s, phase:'이동' }); } });
    if (i===0){
      let lf=null;
      L.push({ dest:()=>({ pos:lf.cam, tgt:lf.tgt }), dur:fast?2:3, kick:6,
        onStart:()=>{ lf=landingFrame(s); dogSurf=lf; showTitle(con.name, `${s.name} · 지구에서 ${fmtLy(s.ly)}광년`); } });
      L.push({ hold:STAY, noOrbit:true, onStart:()=>say(lf), onDone:()=>{ dogSurf=null; hush(); hideTitle(); } });
    } else {
      L.push({ hold:holdT+1, onStart:()=>{ dogLand=s; Object.assign(hud,{ route:`${con.name} · ${s.name}`, kind:'star', star:s, phase:'근접 비행' });
          showTitle(con.name, `${s.name} · 지구에서 ${fmtLy(s.ly)}광년`); }, onDone:()=>{ dogLand=null; hideTitle(); } });
    }
  });
  if (!noView) L.push({ dest:()=>conView(con), dur:3.5, onStart:()=>Object.assign(hud,{ route:con.name, kind:'view', phase:'전경' }) });

/* ---------- 항해 시나리오 ---------- */
const hud={ route:'', kind:'', dest:null, total:0, star:null, phase:'' };
let hudLinger=false, hudTimer=0;
function showTitle(big, small){ $('tCon').textContent=big; $('tStar').textContent=small||''; $('title').classList.add('show'); }
function hideTitle(){ $('title').classList.remove('show'); }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// 전체 항해: 태양계 → 지구 → 모든 별자리(무작위, 별자리마다 '행성계'처럼) → 태양계
function grandTour(){
  cancelVoyage(); voyaging=true; markNav('tour'); updatePanels();
  const order=shuffle(CONS.slice()).slice(0,12), L=[];
  if (!inSolar) L.push(returnLeg(null,'태양계로'));
  else L.push({ dest:()=>destFor(null), onStart:()=>Object.assign(hud,{ route:'태양계', kind:'home', phase:'이동' }) });
  L.push({ hold:6, onStart:()=>{ Object.assign(hud,{ route:'태양계', kind:'home', phase:'전경' }); showTitle('태양계','태양과 여덟 행성'); }, onDone:hideTitle });
  L.push({ dest:()=>destFor(EARTH), onStart:()=>Object.assign(hud,{ route:'태양계 → 지구', kind:'home', phase:'이동' }) });
  L.push({ hold:3, follow:EARTH, onStart:()=>{ dogOn=true; Object.assign(hud,{ route:'지구', kind:'home', phase:'출발 준비' }); showTitle('지구',''); }, onDone:hideTitle });
  let prev='지구';
  order.forEach((con,i)=>{
    L.push(i===0 ? departLeg(con,prev) : hopLeg(con,prev));
    L.push(systemHold(con));
    L.push(...starLegs(con, 3, 2.4));
    prev=con.name;
  });
  L.push({ ...returnLeg(null,'태양계로 귀환'), onDone:(function(base){ return ()=>{ base(); voyaging=false; selCon=null; markNav(''); updatePanels();
    showTitle('항해 완료', `별자리 ${order.length}곳 방문`); setTimeout(hideTitle,4000); }; })(returnLeg(null).onDone) });
  runLegs(L);
}
// 별자리 하나: 지구에서 출발
function voyage(con, opt={}){
  cancelVoyage(); voyaging=true; markNav(con.id); updatePanels();
  const L=[];
  if (!inSolar) L.push(returnLeg(EARTH,'지구로 귀환'));
  else L.push({ dest:()=>destFor(EARTH), onStart:()=>Object.assign(hud,{ route:'지구', kind:'home', phase:'이동' }) });
  L.push({ hold:1.8, follow:EARTH, onStart:()=>{ dogOn=true; Object.assign(hud,{ route:'지구', kind:'home', phase:'출발 준비' }); } });
  L.push(departLeg(con,'지구'));

  L.push(...starLegs(con, opt.back?3:5, 2.8, opt.first||null));

    ? ()=>{ voyaging=false; updatePanels(); showOverview(); }
    : ()=>{ voyaging=false; hudLinger=true; hudTimer=4; hud.phase='자유 탐색'; controls.minDistance=20; updatePanels(); };

}
function goHome(){

  else runLegs([returnLeg(null,'태양계로 귀환')]);
}
function flyToStar(s){
  if (s.id==='sun') return goHome();
  if (voyaging) cancelVoyage(); setView('none');
  runLegs([{ dest:()=>nearStar(s, s._from), onStart:()=>{ s._from=camera.position.clone(); }, onDone:()=>{ controls.minDistance=Math.max(s.cur,.5)*1.5; } }]);
}
let viewMode='none'; const vCur={boost:0,tint:0,lines:0}, vTgt={boost:0,tint:0,lines:0};
function setView(mode){
  viewMode=mode; vTgt.boost=mode==='overview'?7:0; vTgt.tint=mode==='overview'?1:0; vTgt.lines=0;
  for (const c of CONS) if (c.label) c.label.style.color = mode==='overview'?c.css:'';
  markNav(mode==='overview'?'ov':mode==='sky'?'sky':'');
}
function updateView(dt){
  if (viewMode==='overview') vTgt.boost=Math.max(0,Math.min(7, 7+5*Math.log10(camera.position.distanceTo(controls.target)/OVERVIEW_V().pos.length())));
  const k=Math.min(1,dt*1.6);
  for (const key in vCur) vCur[key]+=(vTgt[key]-vCur[key])*k;
  starMat.uniforms.boost.value=vCur.boost; starMat.uniforms.tint.value=vCur.tint;
  conLinesMat.opacity=.55*vCur.lines*layerOpacity; starLayer.getObjectByName('conLines').visible=conLinesMat.opacity>.01;
}
const OVERVIEW_V=(()=>{ let v=null; return ()=>{ if (!v){
  const ds=STARS.filter(s=>s.ly).map(s=>s.pos.length()).sort((a,b)=>a-b), r=ds[Math.floor(ds.length*.9)];
  v={ pos:new V3(.55,.42,.72).normalize().multiplyScalar(r*2.1), tgt:new V3(0,0,0) }; } return v; }; })();
function spaceLeg(destFn, mode){
  const md=()=>{ controls.minDistance = mode==='sky' ? .5 : 20; };
  if (inSolar) return { dest:destFn, dur:6.5, ease:easeQuint, kick:22,
    onStart:()=>{ inSolar=false; starLayer.visible=true; setBigCon(null); setView(mode); },
    onStep:(k,t)=>{ setSolarScale(Math.exp(Math.log(SOLAR_MIN)*Math.min(1,t/.3))); setLayerOpacity(Math.min(1,t/.25)); },
    onDone:()=>{ solarGroup.visible=false; setLayerOpacity(1); md(); } };
  return { dest:destFn, dur: mode==='overview'?5:4.5, ease:easeQuint, kick:16,
    onStart:()=>{ setBigCon(null); setView(mode); }, onDone:md };
}
function showOverview(){ cancelVoyage(); runLegs([spaceLeg(OVERVIEW_V,'overview')]); }
function showSky(con){
  cancelVoyage(); const c=con||CON_BY_ID['Ori'];
  runLegs([spaceLeg(()=>({ pos:new V3(0,0,0), tgt:c.centroid.clone().normalize().multiplyScalar(2) }),'sky')]);
}
function cancelVoyage(){

  legs=[]; leg=null; voyaging=false; trick=null; dogLand=null; dogSurf=null; window.__lastSurf=null; hush(); hudLinger=false; controls.enabled=true; hideTitle();
  camera.fov=55; camera.updateProjectionMatrix();

/* ================= 배경음악 (Web Audio로 직접 합성·연주) =================
   D 리디안 느낌의 4화음 진행 위에 패드, 베이스, 아르페지오, 종소리.
   항해 속도가 빨라지면 필터가 열리고 아르페지오와 심장박동 같은 저음 펄스가 커짐. */
const Music=(()=>{
  let ctx=null, master, padBus, arpBus, filt, rev, on=false, timer=null, step=0, nextT=0, cruise=0, userOff=false;
  const BPM=76, E=60/BPM/2;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const CHORDS=[ [50,57,61,64,66,69],   // Dmaj9
                 [47,54,57,61,62,66],   // Bm9
                 [43,50,54,57,61,62],   // Gmaj7(#11)
                 [45,52,57,59,64,66] ]; // A(add9)
  const ARP=[0,1,2,3,2,1,3,4, 0,2,1,3,4,3,2,1];
  function impulse(sec){
    const len=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,len,ctx.sampleRate);
    for (let c=0;c<2;c++){ const d=b.getChannelData(c); for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
    return b;
  }
  function init(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0;
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
    master.connect(comp); comp.connect(ctx.destination);
    rev=ctx.createConvolver(); rev.buffer=impulse(5); const rg=ctx.createGain(); rg.gain.value=.6; rev.connect(rg); rg.connect(master);
    padBus=ctx.createGain(); padBus.gain.value=.11;
    filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=750; filt.Q.value=.8;
    padBus.connect(filt); filt.connect(master); filt.connect(rev);
    arpBus=ctx.createGain(); arpBus.gain.value=.06;
    const dly=ctx.createDelay(1); dly.delayTime.value=E*1.5; const fb=ctx.createGain(); fb.gain.value=.4;
    const dlf=ctx.createBiquadFilter(); dlf.type='lowpass'; dlf.frequency.value=2400;
    arpBus.connect(master); arpBus.connect(rev); arpBus.connect(dly); dly.connect(dlf); dlf.connect(fb); fb.connect(dly); dlf.connect(master);
  }
  function env(g,t,a,peak,hold,rel){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.setValueAtTime(peak,t+a+hold); g.gain.linearRampToValueAtTime(0,t+a+hold+rel); }
  function pad(m,t,dur){
    for (const det of [-8,7]){ const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=det;
      env(g,t,2.4,.09,Math.max(.1,dur-2.4),3.2); o.connect(g); g.connect(padBus); o.start(t); o.stop(t+dur+3.5); }
  }
  function bass(m,t,dur){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=mtof(m);
    env(g,t,1.2,.22,Math.max(.1,dur-1.2),2); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+2.2); }
  function pluck(m,t,vel){
    const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle'; o.frequency.value=mtof(m); o2.type='sine'; o2.frequency.value=mtof(m+12);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22*vel,t+.006); g.gain.exponentialRampToValueAtTime(.0008,t+1.1);
    o.connect(g); o2.connect(g); g.connect(arpBus); o.start(t); o2.start(t); o.stop(t+1.2); o2.stop(t+1.2);
  }
  function bell(m,t,amp=.05){
    for (const [r,a] of [[1,1],[2.76,.4],[5.4,.15]]){ const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=mtof(m)*r;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(amp*a,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+3);
      o.connect(g); g.connect(rev); g.connect(master); o.start(t); o.stop(t+3.1); }
  }
  function pulse(t,amp){ const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(38,t+.32);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(amp,t+.008); g.gain.exponentialRampToValueAtTime(.001,t+.4);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+.45); }
  function schedule(st,t){
    const ch=CHORDS[Math.floor(st/16)%4], bar=st%16;
    if (bar===0){ ch.slice(1).forEach(m=>pad(m,t,16*E)); bass(ch[0]-12,t,16*E); }
    const tones=ch.slice(2).map(m=>m+12);
    const playArp = cruise>.25 || st%2===0;
    if (playArp){ const idx=ARP[bar]%tones.length; pluck(tones[idx]+(Math.random()<.12?12:0), t, .6+.4*Math.random()); }
    if (cruise>.3 && st%2===0) pulse(t,.28*cruise);
    if (bar===8 && Math.random()<.55) bell(tones[Math.floor(Math.random()*tones.length)]+12, t+E*.5);
  }
  function tick(){ while (nextT < ctx.currentTime+.3){ schedule(step,nextT); nextT+=E; step++; } }
  function start(){
    if (!ctx) init();
    ctx.resume(); on=true; nextT=ctx.currentTime+.1;
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
    master.gain.linearRampToValueAtTime(.85,ctx.currentTime+2.5);
    clearInterval(timer); timer=setInterval(tick,25);
  }
  function stop(){
    if (!ctx) return; on=false;
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
    master.gain.linearRampToValueAtTime(0,ctx.currentTime+1);
    setTimeout(()=>{ if (!on){ clearInterval(timer); ctx.suspend(); } },1200);
  }
  return {
    get on(){ return on; },
    toggle(){ if (on){ stop(); userOff=true; } else { start(); userOff=false; } return on; },
    autoStart(){ if (!on && !userOff) start(); },
    set userOff(v){ userOff=!!v; }, get userOff(){ return userOff; },
    resume(){ return ctx && ctx.state!=='running' ? ctx.resume() : Promise.resolve(); },
    get running(){ return !!ctx && ctx.state==='running'; },
    setSpeed(spd){ if (!ctx || !on) return;
      const target=Math.min(1,Math.max(0,(Math.log10(Math.max(spd,1))-1.3)/1.8)); cruise+=(target-cruise)*.04;
      const t=ctx.currentTime; filt.frequency.setTargetAtTime(750+2600*cruise,t,.4); arpBus.gain.setTargetAtTime(.06+.16*cruise,t,.4); },
    chime(){ if (!ctx || !on) return; const t=ctx.currentTime+.05; [74,78,81,86].forEach((m,i)=>bell(m,t+i*.16,.09)); }
  };
})();

const pick={ y:'', m:'', d:'' };

const HOLD_MS=1200;

// 크게: 지구에서 출발해 고른 별들을 차례로 방문
function quick(leg,k){ const base=leg.onStart; leg.onStart=(L)=>{ if (base) base(L); if (L.dur) L.dur*=k; }; return leg; }
function stopToSolar(){          // 항해 중단 → 태양계로
  cancelVoyage(); setView('none'); markNav(''); hideTitle(); hush();
  if (inSolar) runLegs([{ dest:()=>destFor(null), onDone:()=>{ controls.minDistance=12; } }]);
  else runLegs([returnLeg(null,'태양계로 귀환')]);

function voyageRoute(stars){
  cancelVoyage(); voyaging=true; markNav('tour'); updatePanels();
  const L=[];
  if (!inSolar) L.push(returnLeg(EARTH,'지구로 귀환'));
  else L.push({ dest:()=>destFor(EARTH), onStart:()=>Object.assign(hud,{ route:'지구', kind:'home', phase:'이동' }) });
  L.push({ hold:2, follow:EARTH, onStart:()=>{ dogOn=true; markRoute(-1); showTitle('지구',''); }, onDone:hideTitle });
  let prev='지구';
  stars.forEach((st,i)=>{ const con=CON_BY_ID[st.con];
    L.push({ hold:0, onStart:()=>markRoute(i) });
    L.push(quick(i===0 ? departLeg(con,prev) : hopLeg(con,prev), .4));
    L.push(...starLegs(con,1,2.6,st,true,true));
    prev=con.name; });
  L.push({ ...returnLeg(null,'태양계로 귀환'), onDone:(function(base){ return ()=>{ base(); voyaging=false; selCon=null; markNav(''); markRoute(stars.length); updatePanels();
    showTitle('항해 완료', `별 ${stars.length}곳 방문`); setTimeout(hideTitle,4000); }; })(returnLeg(null).onDone) });
  runLegs(L);
}
function setupHold(btn){
  let t0=0, raf=0, done=false;
  // 버튼 아래 진행 막대
  const track=document.createElement('div'); track.className='holdtrack'; track.setAttribute('role','progressbar');
  track.setAttribute('aria-valuemin','0'); track.setAttribute('aria-valuemax','100');
  const bar=document.createElement('i'); track.appendChild(bar); btn.after(track);
  let holding=false;
  // 화면 갱신이 멈춰도 진행되도록 rAF 대신 시계 기반 타이머 사용
  const tick=()=>{ if (!holding) return; const k=Math.min(1,(performance.now()-t0)/HOLD_MS); bar.style.width=(k*100)+'%'; track.setAttribute('aria-valuenow',Math.round(k*100));
    if (k>=1){ holding=false; done=true; clearInterval(raf); btn.classList.remove('holding'); btn.classList.add('done'); track.classList.add('done');
      try { btn.dispatchEvent(new CustomEvent('hold-complete')); } catch(err){ console.error(err); }
      setTimeout(()=>{ btn.classList.remove('done'); track.classList.remove('done','show'); bar.style.width='0%'; },900); } };
  const down=(e)=>{ if (holding) return; if (e.cancelable) e.preventDefault();
    if (e.pointerId!=null && btn.setPointerCapture){ try { btn.setPointerCapture(e.pointerId); } catch(err){} }   // 손가락이 버튼 밖으로 벗어나도 계속
    holding=true; done=false; t0=performance.now(); clearInterval(raf); raf=setInterval(tick,16);
    btn.classList.add('holding'); track.style.top=Math.round(btn.getBoundingClientRect().bottom+3)+'px'; track.classList.add('show'); bar.style.width='0%'; };
  const up=()=>{ if (!holding) return; holding=false; clearInterval(raf); btn.classList.remove('holding'); if (!done){ bar.style.width='0%'; track.classList.remove('show'); } };
  if (window.PointerEvent){
    btn.addEventListener('pointerdown',down); ['pointerup','pointercancel','lostpointercapture'].forEach(t=>btn.addEventListener(t,up));
  } else {                                    // 아주 오래된 기기용
    btn.addEventListener('mousedown',down); addEventListener('mouseup',up);
  }
  // 터치: 길게 누를 때 뜨는 복사 메뉴·돋보기·스크롤을 막음
  btn.addEventListener('touchstart',e=>{ if (e.cancelable) e.preventDefault(); if (!window.PointerEvent) down(e); },{ passive:false });
  btn.addEventListener('touchend',e=>{ if (e.cancelable) e.preventDefault(); if (!window.PointerEvent) up(); },{ passive:false });
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
function syncPickButtons(){
  const set=(id,ic,v)=>{ const el=document.querySelector(`#nav button[data-id=${id}]`); if (el) el.innerHTML = v ? `${ic}<span class="pv">${v}</span>` : ic; };

function closePicker(){ $('pop').classList.add('hidden'); }
function openPicker(kind){

const labelsEl=$('labels');
function mkLabel(text,cls,fn){ const el=document.createElement('button'); el.className='lbl'+(cls?' '+cls:''); el.textContent=text; el.onclick=fn; labelsEl.appendChild(el); return el; }
function buildUI(){
  buildNav();
  for (const b of BODIES) b.label=mkLabel(b.name,'',()=>{});
  for (const s of STARS) if (s.name) s.label=mkLabel(s.name,'star',()=>{ if (!mini.on) flyToStar(s); });
  for (const c of CONS) c.label=mkLabel(c.name,'con',()=>{ if (!mini.on) voyage(c); });

  let conLang='ko'; try { conLang=localStorage.getItem('sv-conLang')||'ko'; } catch(e){}
  const setConLang=(l)=>{ conLang=l; window.__lang=l; for (const c of CONS){ c.name = l==='en'?c.nameEn:c.nameKo; if (c.label) c.label.textContent=c.name; }
    STAR_ROWS.forEach((r,i)=>{ const st=STARS[i]; st.name = l==='en'?r.nameEn:r.nameKo; if (st.label) st.label.textContent=st.name; });
    $('lang').textContent = l==='en' ? '🌐 EN' : '🌐 한글'; if (route) showRoute(); try { localStorage.setItem('sv-conLang',l); } catch(e){} };
  $('lang').onclick=(e)=>{ e.stopPropagation(); setConLang(conLang==='en'?'ko':'en'); };
  setConLang(conLang);
  // 배경음악은 항상 재생: 브라우저가 첫 터치/키 입력 전에는 소리를 막아서, 첫 입력 때 시작
  // 브라우저는 사용자가 화면을 누르기 전엔 소리를 막음 → 누를 때마다 시도하고, 실제로 소리가 나기 시작하면 멈춤
  const EV=['pointerdown','pointerup','click','keydown','touchend'];
  const startMusic=()=>{ try { Music.autoStart(); Music.resume().then(()=>{ if (Music.running) EV.forEach(t=>removeEventListener(t,startMusic,true)); }).catch(()=>{}); } catch(err){} };
  EV.forEach(t=>addEventListener(t,startMusic,true));
  // 다른 탭에 다녀오거나 화면이 꺼졌다 켜지면 다시 재생
  document.addEventListener('visibilitychange',()=>{ if (!document.hidden && Music.on) Music.resume().catch(()=>{}); });
  // 음악 켜기/끄기 (한글 버튼 뒤): 선택은 기억해 둠
  const musicLabel=()=>{ const on=!Music.userOff; $('music').textContent = on ? '🎵 켜짐' : '🔇 꺼짐'; $('music').setAttribute('aria-pressed', on?'true':'false'); };
  try { if (localStorage.getItem('sv-music')==='off') Music.userOff=true; } catch(e){}
  $('music').onclick=(e)=>{ e.stopPropagation();
    if (Music.userOff){ Music.userOff=false; Music.autoStart(); Music.resume().catch(()=>{}); }
    else { if (Music.on) Music.toggle(); Music.userOff=true; }
    try { localStorage.setItem('sv-music', Music.userOff?'off':'on'); } catch(e){}
    musicLabel(); };
  musicLabel();
  window.__musicState=()=>Music.running?'running':(Music.on?'blocked':'off');
}

const fmtLy=ly=> ly<10 ? ly.toFixed(2) : ly<1000 ? ly.toFixed(1) : Math.round(ly).toLocaleString();
function fmtC(n){
  if (n<1) return '—';
  if (n<1e4) return Math.round(n).toLocaleString()+'배';
  if (n<1e8) return (n/1e4).toFixed(1)+'만 배';
  if (n<1e12) return (n/1e8).toFixed(1)+'억 배';
  return (n/1e12).toFixed(1)+'조 배';
}

function updateHud(){}

/* ---------- 이름표 ---------- */
const proj=new V3();
function place(el, p, show, dx, dy){
  if (!show && el._hid) return; el._hid=!show;
  el.style.opacity = show?1:0; el.style.pointerEvents = show?'auto':'none';
  if (show) el.style.transform=`translate(${(p.x*.5+.5)*innerWidth}px,${(-p.y*.5+.5)*innerHeight}px) translate(${dx},${dy})`;
}
const onScreen=p=>p.z<1 && Math.abs(p.x)<1.05 && Math.abs(p.y)<1.05;
function updateLabels(){
  const solarOn = solarGroup.visible && solarGroup.scale.x>.5;
  for (const b of BODIES){
    if (!solarOn){ place(b.label,null,false); continue; }
    b.pivot.getWorldPosition(proj); const dist=proj.distanceTo(camera.position);
    proj.y += b.r*1.25; proj.project(camera);
    place(b.label, proj, onScreen(proj) && dist>b.r*4, '-50%', '-140%');
  }
  const starsOn = starLayer.visible && layerOpacity>.6;
  for (const s of STARS){ if (!s.label) continue;
    if (!starsOn){ place(s.label,null,false); continue; }
    const du=s.pos.distanceTo(camera.position), d=du/LY;
    const m = (s.id==='sun'?4.83:s.M)+5*(Math.log10(Math.max(d,1e-6)/3.2616)-1);
    proj.copy(s.pos).project(camera);
    const big = bigCon && s.con===bigCon.id;
    const near = s.cur && du < s.cur*60;
    const focus = mini.on && miniAuto && mini.con && s.con===mini.con.id;
    const show = onScreen(proj) && d>.8 && (viewMode==='overview' ? (s.id==='sun' || focus) : (m<1.6 || near || big || s.id==='sun'));
    if (near || big){ const px=s.cur/du/Math.tan(camera.fov*DEG/2)*innerHeight/2; place(s.label, proj, show, '-50%', `calc(-100% - ${Math.round(px+8)}px)`); }
    else place(s.label, proj, show, '10px', '-50%');
  }
  const near20 = starsOn ? new Set(CONS.slice().sort((a,b)=>a.centroid.distanceTo(camera.position)-b.centroid.distanceTo(camera.position)).slice(0,20)) : null;
  for (const c of CONS){
    const show = starsOn && (mini.on && miniAuto ? (c===mini.con || c===mini.prevCon) : (viewMode!=='none' || near20.has(c))) && !(voyaging && hud.kind==='travel') && c!==bigCon;
    if (!show){ place(c.label,null,false); continue; }
    proj.copy(c.centroid).project(camera);
    place(c.label, proj, onScreen(proj), '-50%', '-50%');
  }
}

/* ================= 루프 ================= */
let last=performance.now(), spd=0; const lastCam=new V3(), vel=new V3();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  simDays+=speed*dt; updateBodies();
  controls.autoRotate = !leg && !voyaging && inSolar && viewMode==='none'; controls.autoRotateSpeed=.35;   // 태양계를 천천히 돌며 보여 줌
  if (leg) updateLeg(dt); else controls.update();
  if (dt>0){ vel.copy(camera.position).sub(lastCam).divideScalar(dt); spd += (vel.length()-spd)*.15; }
  lastCam.copy(camera.position);
  updateDog(dt, spd);
  Music.setSpeed(spd);
  updateStarSizes(dt);
  updateView(dt);
  for (const m of starBodyMats) m.uniforms.time.value=now/1000;
  for (const s of STARS) if (s.body) s.body.rotation.y += dt*.05;
  if (hudLinger){ hudTimer-=dt; if (hudTimer<=0){ hudLinger=false; updatePanels(); } }
  updateHud(spd);
  { const away = !!(voyaging || viewMode==='overview' || !inSolar || (leg && solarGroup.scale.x<.99)); const zs=$('zStop'); if (zs.classList.contains('hidden')===away) zs.classList.toggle('hidden',!away); }
  bgStars.position.copy(camera.position);
  updateLabels();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

},30);
